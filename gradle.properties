# Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# App version: name is set per release; code = 220 + commit count (APP_VERSION_CODE is only a floor); CI appends -<commit> to the name for non-release builds
APP_VERSION_NAME=2.3.5
APP_VERSION_CODE=250
# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# Kotlin
kotlin.code.style=official
kotlin.mpp.applyDefaultHierarchyTemplate=false
# GitHub OAuth App（Device Flow 用，不需要 client_secret）
# 申请：GitHub → Settings → Developer settings → OAuth Apps → New OAuth App，勾选 Enable Device Flow
# 留空时设置页的「GitHub 授权」只能手动填 Personal Access Token
appmarket.githubOAuth.clientId=
appmarket.githubOAuth.scope=read:user
